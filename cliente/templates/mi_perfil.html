{% extends 'cliente.html' %}
{% block title %}Mi perfil — CarneClick{% endblock %}

{% block content %}
<div class="pg-header">
    <div class="pg-title"><i class="bi bi-person-circle"></i> Mi perfil</div>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="content-card h-100">
                <p class="card-section-title">Datos de acceso</p>
                <div class="p-3">
                    <div class="mb-3">
                        <label class="form-label small fw-600">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user_obj.email }}">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="content-card h-100">
                <p class="card-section-title">Datos personales</p>
                <div class="p-3">
                    {{ cliente_form.as_p }}
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="content-card">
                <p class="card-section-title">Datos del comercio</p>
                <div class="p-3">
                    {{ comercio_form.as_p }}
                </div>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary px-4" type="submit">
                <i class="bi bi-floppy me-1"></i> Guardar cambios
            </button>
        </div>
    </div>
</form>
{% endblock %}
